name: CI

# Runs on every PR and every push to master.
# Catches what reviewers can't see at a glance: a broken compile, a regressed
# unit test, an Android Lint error, or an instrumented-test regression
# (Room migrations, Compose UI) introduced since the previous commit.
on:
  push:
    branches: [ master ]
  pull_request:

# Cancel any in-flight CI run for the same ref when a new commit lands —
# saves runner minutes when someone force-pushes a stack of fixes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # AGP 9.x + Kotlin 2.3 require JDK 17. Temurin distribution matches the
      # local dev environment defaults.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle action handles wrapper validation, dependency cache, and
      # configuration cache — collapses ~3 manual steps into one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The app reads PROXY_BASE_URL out of local.properties at build time
      # (see app/build.gradle.kts buildConfigField). CI has no real Worker —
      # any HTTPS URL keeps the build happy; tests don't hit the network.
      - name: Stub local.properties for CI
        run: echo "PROXY_BASE_URL=https://ci.invalid" > local.properties

      # google-services.json is gitignored; supply a no-op file so the
      # GoogleServices plugin task doesn't fail the build. Real Firebase
      # integration is exercised in the production release pipeline, not here.
      # Two client entries: the release applicationId AND the debug variant
      # (`applicationIdSuffix = ".debug"` — see app/build.gradle.kts) — the
      # plugin matches per-variant and fails the build if either is missing.
      - name: Stub google-services.json for CI
        run: |
          mkdir -p app
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "ci-stub",
              "storage_bucket": "ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1111111111111111",
                  "android_client_info": { "package_name": "com.kartik.mealtime" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-stub-key" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:2222222222222222",
                  "android_client_info": { "package_name": "com.kartik.mealtime.debug" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-stub-key" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Android lint (debug)
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Surface test + lint reports on every run so failures are debuggable
      # without re-running locally. Keep small — 7-day retention is enough.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  instrumented-tests:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    # Emulator boot + AVD snapshot creation on a cold cache can take 8–10 min;
    # subsequent runs hit the cache and finish in ~5. 45-min ceiling absorbs
    # the occasional slow GitHub runner.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # reactivecircus/android-emulator-runner uses hardware-accelerated KVM
      # for ~3× faster boot. ubuntu-latest runners have /dev/kvm but the
      # default udev rule restricts it to root — this opens it to the runner.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stub local.properties for CI
        run: echo "PROXY_BASE_URL=https://ci.invalid" > local.properties

      - name: Stub google-services.json for CI
        run: |
          mkdir -p app
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "ci-stub",
              "storage_bucket": "ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1111111111111111",
                  "android_client_info": { "package_name": "com.kartik.mealtime" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-stub-key" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:2222222222222222",
                  "android_client_info": { "package_name": "com.kartik.mealtime.debug" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-stub-key" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # Cache the created AVD between runs — the snapshot is ~1 GB but saves
      # 4–6 min of "create system image + boot from cold" on every run.
      # Key includes the API level so bumping it invalidates the cache.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api29-v1

      # On a cache miss, boot the AVD once with no script to generate the
      # snapshot, then the real test run below restores from it instantly.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # API 29 chosen as a balance: above minSdk 26, below 30+ (which often
      # need extra emulator flags for Google Play APIs). Pixel 6 profile gives
      # a realistic screen geometry for Compose UI tests.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
