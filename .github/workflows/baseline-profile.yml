name: Baseline Profile

# Generates a fresh baseline profile by running the macrobenchmark in
# :baselineprofile against a KVM-accelerated emulator, then commits the
# resulting profile back to the repo so the next release build picks it up.
#
# Intentionally NOT part of ci.yml: profile generation needs an emulator and
# adds ~15 min to every PR — wasted work since the profile only needs to be
# refreshed when startup-critical code paths change. Run on demand, or
# automatically when a release tag is pushed.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate baseline profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Hardware acceleration via KVM — without this the emulator falls back
      # to software rendering and the macrobenchmark can time out.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stub local.properties for CI
        run: echo "PROXY_BASE_URL=https://ci.invalid" > local.properties

      # Same stub as ci.yml — real Firebase isn't needed to generate a profile,
      # we just need the build to succeed. Two client entries (debug + release).
      - name: Stub google-services.json for CI
        run: |
          mkdir -p app
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "ci-stub",
              "storage_bucket": "ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1111111111111111",
                  "android_client_info": { "package_name": "com.kartik.mealtime" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-stub-key" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:2222222222222222",
                  "android_client_info": { "package_name": "com.kartik.mealtime.debug" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-stub-key" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # API 34 + google_apis: baselineprofile module declares minSdk 28 so 34
      # is well within range, and the macrobenchmark library is best-tested on
      # API 31+. google_apis target is required for Play Services-linked code
      # paths to resolve during the trace.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-baselineprofile-api34-v1

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      # generateBaselineProfile runs the producer module's macrobenchmark,
      # captures the startup trace, and writes the .txt under
      # app/src/<variant>/generated/baselineProfiles/. The release variant
      # is what gets packaged into the AAB.
      - name: Generate baseline profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:generateBaselineProfile --no-daemon

      # Upload the generated profile so it can be inspected even when the
      # auto-commit step is skipped (e.g. tag pushes commit to a detached HEAD).
      - name: Upload baseline profile artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: app/src/**/generated/baselineProfiles/baseline-prof.txt
          if-no-files-found: error
          retention-days: 30

      # On workflow_dispatch from a branch, commit the refreshed profile back
      # so the next release picks it up automatically. Skip on tag pushes —
      # those run from a detached HEAD and have nothing to push to.
      - name: Commit refreshed profile
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/**/generated/baselineProfiles/baseline-prof.txt || true
          if git diff --cached --quiet; then
            echo "No profile changes to commit."
          else
            git commit -m "chore(perf): refresh baseline profile"
            git push origin HEAD:${{ github.ref_name }}
          fi
