<?xml version="1.0" encoding="UTF-8"?>
<!--
  MealTime — Google Play feature graphic (1024x500).
  Forest-green background with the launcher-icon tile on the left and the
  app name + tagline on the right. Text is real <text> (editable in
  Figma/Canva/Inkscape) — tweak the wording or swap the font freely.

  Export to PNG at exactly 1024x500 (Play requires JPG or 24-bit PNG, no alpha):
    rsvg-convert -w 1024 -h 500 feature-graphic-1024x500.svg > feature-graphic.png
  Playfair Display (the app's title font) is used if available, else a serif fallback.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Background -->
  <rect width="1024" height="500" fill="#2D5A5A"/>

  <!-- Icon tile (slightly lighter green, rounded like the launcher) -->
  <rect x="70" y="120" width="260" height="260" rx="56" fill="#356B6B"/>
  <g transform="translate(125,175) scale(6.25)">
    <path fill="#FAF7F5"
      d="M8.1,13.34l2.83,-2.83L3.91,3.5c-1.56,1.56,-1.56,4.09,0,5.66L8.1,13.34zM14.88,11.53c1.53,0.71,3.68,0.21,5.27,-1.38c1.91,-1.91,2.28,-4.65,0.81,-6.12c-1.46,-1.46,-4.2,-1.1,-6.12,0.81c-1.59,1.59,-2.09,3.74,-1.38,5.27L3.7,19.87l1.41,1.41L12,14.41l6.88,6.88l1.41,-1.41L13.41,13L14.88,11.53z"/>
  </g>

  <!-- App name + tagline -->
  <text x="385" y="250" fill="#FAF7F5"
        font-family="Playfair Display, Georgia, 'Times New Roman', serif"
        font-size="120" font-weight="600">MealTime</text>
  <text x="388" y="312" fill="#FAF7F5" fill-opacity="0.85"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="400">AI-powered recipes &amp; smart cooking</text>
</svg>
