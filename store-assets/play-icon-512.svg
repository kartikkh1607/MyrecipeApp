<?xml version="1.0" encoding="UTF-8"?>
<!--
  MealTime — Google Play Store icon (512x512).
  Faithful vector rendering of the adaptive launcher icon:
    background = solid forest green (#2D5A5A), full square
    foreground = cream "restaurant" knife+fork glyph (#FAF7F5), scaled 2.67x
                 and offset (22,22) within the 108-unit canvas (matches
                 ic_launcher_foreground.xml exactly).

  Export to PNG at 512x512. Play requires a FULL SQUARE, 32-bit PNG with NO
  transparency and NO rounded corners — Google applies its own rounding/mask.
  Open in Inkscape/Figma/Canva or run:  rsvg-convert -w 512 -h 512 play-icon-512.svg > play-icon-512.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#2D5A5A"/>
  <g transform="translate(22,22) scale(2.67)">
    <path fill="#FAF7F5"
      d="M8.1,13.34l2.83,-2.83L3.91,3.5c-1.56,1.56,-1.56,4.09,0,5.66L8.1,13.34zM14.88,11.53c1.53,0.71,3.68,0.21,5.27,-1.38c1.91,-1.91,2.28,-4.65,0.81,-6.12c-1.46,-1.46,-4.2,-1.1,-6.12,0.81c-1.59,1.59,-2.09,3.74,-1.38,5.27L3.7,19.87l1.41,1.41L12,14.41l6.88,6.88l1.41,-1.41L13.41,13L14.88,11.53z"/>
  </g>
</svg>
